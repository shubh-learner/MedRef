<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedRef — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-container">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-brand-icon">⚕</div>
      <div class="auth-brand-name">MedRef</div>
      <div class="auth-brand-sub">Clinical AI Reference</div>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login"  onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab"        id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div class="divider-or">
        <span>or</span>
      </div>

      <button id="google-signin-btn" type="button" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
      <!-- Login Form -->
      <div id="form-login">
        <div class="field-group">
          <label class="field-label">Email</label>
          <input id="login-email" type="email" class="field-input" placeholder="doctor@hospital.com" />
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <input id="login-password" type="password" class="field-input" placeholder="••••••••" />
        </div>
        <button class="auth-btn" id="login-btn" onclick="handleLogin()">Sign In</button>
      </div>

      <!-- Register Form -->
      <div id="form-register" class="hidden">
        <div class="field-group">
          <label class="field-label">Full Name</label>
          <input id="reg-name" type="text" class="field-input" placeholder="Dr. John Smith" />
        </div>
        <div class="field-group">
          <label class="field-label">Email</label>
          <input id="reg-email" type="email" class="field-input" placeholder="doctor@hospital.com" />
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <input id="reg-password" type="password" class="field-input" placeholder="Min. 6 characters" />
        </div>
        <div class="field-group">
          <label class="field-label">Groq API Key</label>
          <input id="reg-groqkey" type="password" class="field-input" placeholder="gsk_..." />
          <span class="field-hint">
            Get your free key at
            <a href="https://console.groq.com/keys" target="_blank">console.groq.com</a>
          </span>
        </div>
        <button class="auth-btn" id="register-btn" onclick="handleRegister()">Create Account</button>
      </div>

      <!-- Error / Status -->
      <p id="auth-error" class="auth-error"></p>

    </div>

    <p class="auth-disclaimer">⚕️ For licensed medical professionals only.</p>
  </div>

  <script type="module">
    import { loginUser, registerUser, onAuthChange } from "./js/auth.js";
    import { saveGroqKey } from "./js/keyStore.js";
    import { loginWithGoogle } from "./js/auth.js";

    // If already logged in, go straight to app
    onAuthChange((user) => {
      if (user) window.location.href = "/";
    });

    // ── Tab switch ──────────────────────────────────────────────
    window.switchTab = function(tab) {
      document.getElementById("form-login").classList.toggle("hidden", tab !== "login");
      document.getElementById("form-register").classList.toggle("hidden", tab !== "register");
      document.getElementById("tab-login").classList.toggle("active", tab === "login");
      document.getElementById("tab-register").classList.toggle("active", tab === "register");
      clearError();
    };

    // ── Login with email ───────────────────────────────────────────────────
    window.handleLogin = async function() {
      const email    = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const btn      = document.getElementById("login-btn");

      if (!email || !password) return showError("Please fill in all fields.");

      setLoading(btn, true, "Signing in...");
      try {
        await loginUser(email, password);
        // onAuthChange will redirect to /
      } catch (err) {
        showError(friendlyError(err.code));
        setLoading(btn, false, "Sign In");
      }
    };

     // ── Login with Google ───────────────────────────────────────────────────
    document.getElementById("google-signin-btn").addEventListener("click", async () => {
      try {
        const user = await loginWithGoogle();
        // First-time Google sign-in: check if Groq key already exists
        const { loadGroqKey } = await import("./js/keyStore.js");
        const existingKey = await loadGroqKey(user.uid);
        if (!existingKey) {
          // No key yet — redirect to main app, it will auto-prompt Settings on load
          window.location.href = "/";
        } else {
          window.location.href = "/";
        }
      } catch (err) {
        console.error("Google sign-in failed:", err);
        alert("Google sign-in failed: " + err.message);
      }
    });
    
    // ── Register ────────────────────────────────────────────────
    window.handleRegister = async function() {
      const name     = document.getElementById("reg-name").value.trim();
      const email    = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;
      const groqKey  = document.getElementById("reg-groqkey").value.trim();
      const btn      = document.getElementById("register-btn");

      if (!name || !email || !password || !groqKey) return showError("Please fill in all fields.");
      if (!groqKey.startsWith("gsk_")) return showError("Groq API key must start with 'gsk_'.");
      if (password.length < 6) return showError("Password must be at least 6 characters.");

      setLoading(btn, true, "Creating account...");
      try {
        const cred = await registerUser(email, password, name);
        await saveGroqKey(cred.user.uid, groqKey);
        // onAuthChange will redirect
      } catch (err) {
        showError(friendlyError(err.code));
        setLoading(btn, false, "Create Account");
      }
    };

    // ── Helpers ─────────────────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById("auth-error");
      el.textContent = msg;
      el.style.display = "block";
    }
    function clearError() {
      const el = document.getElementById("auth-error");
      el.textContent = "";
      el.style.display = "none";
    }
    function setLoading(btn, loading, label) {
      btn.disabled = loading;
      btn.textContent = label;
    }
    function friendlyError(code) {
      const map = {
        "auth/user-not-found":       "No account found with this email.",
        "auth/wrong-password":       "Incorrect password.",
        "auth/email-already-in-use": "An account with this email already exists.",
        "auth/invalid-email":        "Please enter a valid email address.",
        "auth/weak-password":        "Password is too weak. Use at least 6 characters.",
        "auth/too-many-requests":    "Too many attempts. Please try again later.",
        "auth/invalid-credential":   "Invalid email or password.",
      };
      return map[code] || "Something went wrong. Please try again.";
    }

    // Enter key support
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const loginHidden = document.getElementById("form-login").classList.contains("hidden");
      if (!loginHidden) handleLogin();
      else handleRegister();
    });
  </script>

</body>
</html>
